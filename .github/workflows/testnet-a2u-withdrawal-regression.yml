name: Testnet A2U Deferred Adapter Regression (Mock Only)

on:
  push:
    branches:
      - main
    paths:
      - "server.js"
      - "testnet-outflow-fee-router.js"
      - "testnet-a2u-payout.js"
      - "testnet-a2u-service.js"
      - "tests/testnet-a2u-payout-smoke.js"
      - "tests/testnet-a2u-persistence-smoke.js"
      - "tests/testnet-legacy-stellar-dependency-smoke.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/testnet-a2u-withdrawal-regression.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet-a2u-mock-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-a2u-regression:
    name: A2U mock adapter checks only; official SDK deferred
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact committed dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify legacy Stellar dependency lock contract
        run: node tests/testnet-legacy-stellar-dependency-smoke.js

      - name: Check server syntax
        run: node --check server.js

      - name: Check outflow router syntax
        run: node --check testnet-outflow-fee-router.js

      - name: Check deferred A2U adapter syntax
        run: node --check testnet-a2u-payout.js

      - name: Check deferred A2U service syntax
        run: node --check testnet-a2u-service.js

      - name: Run A2U payout mock tests
        run: node tests/testnet-a2u-payout-smoke.js

      - name: Run A2U persistence mock tests
        run: node tests/testnet-a2u-persistence-smoke.js
