
name: Testnet A2U Withdrawal Regression

on:
  push:
    branches:
      - main
    paths:
      - "server.js"
      - "testnet-outflow-fee-router.js"
      - "testnet-a2u-payout.js"
      - "testnet-a2u-service.js"
      - "tests/testnet-a2u-payout-smoke.js"
      - "tests/testnet-a2u-persistence-smoke.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/testnet-a2u-withdrawal-regression.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet-a2u-withdrawal-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-a2u-regression:
    name: Testnet A2U Safety Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify official Pi Backend SDK
        run: |
          node -e "import('pi-backend').then((m) => {
            const PiNetwork = m.default || m.PiNetwork;
            if (typeof PiNetwork !== 'function') {
              throw new Error('PI_BACKEND_SDK_EXPORT_INVALID');
            }
            console.log('Pi backend SDK import OK');
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });"

      - name: Check server syntax
        run: node --check server.js

      - name: Check outflow router syntax
        run: node --check testnet-outflow-fee-router.js

      - name: Check A2U adapter syntax
        run: node --check testnet-a2u-payout.js

      - name: Check A2U service syntax
        run: node --check testnet-a2u-service.js

      - name: Run A2U payout smoke tests
        run: node tests/testnet-a2u-payout-smoke.js

      - name: Run A2U persistence smoke tests
        run: node tests/testnet-a2u-persistence-smoke.js
