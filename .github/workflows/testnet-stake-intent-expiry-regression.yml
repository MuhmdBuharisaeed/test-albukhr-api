
name: ALBUKHR Testnet Stake Intent Expiry Regression

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261107231515_testnet_expire_unstarted_stake_intents_v1.sql'
      - 'tests/testnet-stake-intent-expiry-migration-smoke.js'
      - 'tests/testnet-stake-intent-expiry-api-guard-smoke.js'
      - 'testnet-staking-router.js'
      - '.github/workflows/testnet-stake-intent-expiry-regression.yml'

  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261107231515_testnet_expire_unstarted_stake_intents_v1.sql'
      - 'tests/testnet-stake-intent-expiry-migration-smoke.js'
      - 'tests/testnet-stake-intent-expiry-api-guard-smoke.js'
      - 'testnet-staking-router.js'
      - '.github/workflows/testnet-stake-intent-expiry-regression.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet-stake-intent-expiry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-regression:
    name: Testnet intent expiry and payment-arm checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f supabase/migrations/20261107231515_testnet_expire_unstarted_stake_intents_v1.sql
          test -f tests/testnet-stake-intent-expiry-migration-smoke.js
          test -f tests/testnet-stake-intent-expiry-api-guard-smoke.js
          test -f testnet-staking-router.js

          echo "Required Testnet files found."

      - name: Check smoke-test JavaScript syntax
        run: |
          node --check tests/testnet-stake-intent-expiry-migration-smoke.js
          node --check tests/testnet-stake-intent-expiry-api-guard-smoke.js

      - name: Run migration safety regression
        run: node tests/testnet-stake-intent-expiry-migration-smoke.js

      - name: Run API payment-arm regression
        run: node tests/testnet-stake-intent-expiry-api-guard-smoke.js
